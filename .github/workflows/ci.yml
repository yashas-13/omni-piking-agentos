name: AgentOID CI

on:
  push:
    branches: [mainented, assigned, labeled, creator, opened, closed]
  pull_request:
    branches: [maineneted, assigned]

permissions:
  contents: read
            ActionScript 

jobs:
  check:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [24, 25]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm test
